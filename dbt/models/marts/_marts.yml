version: 2

# Documentation and data quality tests for the star schema.
# "dbt test" runs every test listed here; each test is a SQL query that
# looks for bad rows, and the test PASSES when it finds none.

models:
  - name: dim_date
    description: "One row per calendar day between the first and last sale."
    columns:
      - name: date_day
        description: "The calendar date (primary key)."
        data_tests:
          - unique
          - not_null

  - name: dim_location
    description: "One row per postcode district, town, district and county combination."
    columns:
      - name: location_key
        description: "Surrogate key: md5 hash of the four location columns."
        data_tests:
          - unique
          - not_null

  - name: dim_property
    description: "One row per property type, new-build flag and tenure combination."
    columns:
      - name: property_key
        description: "Surrogate key: md5 hash of the property columns."
        data_tests:
          - unique
          - not_null
      - name: property_type
        description: "D = Detached, S = Semi-Detached, T = Terraced, F = Flat, O = Other."
        data_tests:
          # Fails if any value outside this list appears
          - accepted_values:
              arguments:
                values: ["D", "S", "T", "F", "O"]

  - name: fact_sale
    description: "One row per property sale, with price and keys to each dimension."
    columns:
      - name: transaction_id
        description: "HM Land Registry transaction ID (primary key)."
        data_tests:
          - unique
          - not_null
      - name: price
        description: "Sale price in pounds."
        data_tests:
          - not_null
      # Relationship tests check every foreign key points to a real
      # dimension row (referential integrity), so no sale is "orphaned"
      - name: date_day
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: location_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: property_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_property')
                field: property_key